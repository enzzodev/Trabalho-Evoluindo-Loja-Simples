<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="batata-cabecalho">
      <h1>EVOLUINDO LOJA SIMPLES</h1>
      <p>Controle de produtos</p>
    </header>

    <main>
      <section class="cartao">
        <h2 id="titulo-formulario">Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 10" required />

          <p id="mensagem-erro" class="mensagem-erro"></p>

          <div class="acoes-formulario">
            <button type="submit" id="botao-formulario">Adicionar produto</button>
            <button type="button" id="botao-cancelar" class="botao-cancelar" hidden>Cancelar</button>
          </div>
        </form>
      </section>

      <section class="cartao" id="batata-produtos">
        <h2>Produtos cadastrados</h2>
        <p id="contador" class="contador">Produtos cadastrados: 0</p>
        <p id="mensagem-vazia" class="mensagem-vazia">Nenhum produto cadastrado.</p>
        <!-- Os produtos são criados pelo script.js, já com os botões Editar e Remover -->
        <ul id="lista-produtos"></ul>
      </section>
    </main>

    <footer id="batata-rodape">
      <p><strong>Loja Simples</strong> - Controle de Produtos</p>
      <p>Projeto da disciplina de Fundamentos Web, feito com HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
